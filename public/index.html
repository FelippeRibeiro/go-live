<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-home">
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="home home-with-hub">
    <header class="brand">
      <p class="brand-mark">Go Live</p>
      <h1 class="brand-tagline">Salas virtuais com latência de transmissão ao vivo.</h1>
      <p class="brand-lead">Compartilhe sua tela em tempo real. Sem plugins, sem instalação.</p>
    </header>

    <section class="hub" aria-label="Lives públicas">
      <div class="hub-head">
        <h2>Lives agora</h2>
        <span id="hub-status" class="hub-status">Conectando…</span>
      </div>
      <div id="hub-grid" class="hub-grid"></div>
      <p id="hub-empty" class="hub-empty">Nenhuma sala pública no momento. Crie uma abaixo.</p>
    </section>

    <section class="actions" aria-label="Criar ou entrar em uma sala">
      <form id="create-form" class="action-block">
        <h2>Criar sala</h2>
        <label>
          <span>Nome</span>
          <input type="text" name="name" placeholder="Minha transmissão" maxlength="64" />
        </label>
        <label>
          <span>Senha <em>(opcional)</em></span>
          <input type="password" name="password" placeholder="Deixe vazio para sala pública" autocomplete="new-password" />
        </label>
        <button type="submit" class="btn btn-primary">Criar e transmitir</button>
      </form>

      <form id="join-form" class="action-block">
        <h2>Entrar com ID</h2>
        <label>
          <span>ID da sala</span>
          <input type="text" name="room_id" placeholder="a1b2-c3d4" required pattern="[a-zA-Z0-9-]+" />
        </label>
        <label>
          <span>Senha</span>
          <input type="password" name="password" placeholder="Se a sala exigir" autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-secondary">Assistir</button>
      </form>
    </section>

    <p id="home-error" class="error" hidden></p>
  </main>

  <script type="module" src="/js/app.js?v=2"></script>
</body>
</html>
