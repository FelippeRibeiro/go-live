root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  entrypoint = ["./tmp/main"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "node_modules", ".git", "frontend", "public"]
  exclude_regex = ["_test\\.go", "internal/db/.*\\.sql\\.go"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
